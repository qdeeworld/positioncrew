name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: positioncrew-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify committed evidence
        run: |
          npm run benchmark:verify-lock
          npm run benchmark:verify-captures
          npm run benchmark:verify-marketplace-protocol
          npm run benchmark:verify-marketplace
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build production bundle
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm run test:e2e
