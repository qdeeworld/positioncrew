name: Production smoke

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: verify-production
        type: choice
        options:
          - verify-production
          - attest-runtime-rotation-evidence

permissions:
  actions: read
  contents: write

concurrency:
  group: positioncrew-production-smoke
  cancel-in-progress: false

jobs:
  verify-production:
    if: github.event_name == 'schedule' || inputs.operation == 'verify-production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install monitor dependencies
        run: npm ci --ignore-scripts
      - name: Verify marketplace and all four providers
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          POSITIONCREW_BASE_URL: https://positioncrew.dolepee.com
          POSITIONCREW_HEALTH_OUTPUT: /tmp/positioncrew-production-health.json
        run: npm run verify:production
      - name: Preserve timestamped health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: positioncrew-production-health-${{ github.run_id }}
          path: /tmp/positioncrew-production-health.json
          if-no-files-found: error
          retention-days: 30
      - name: Record scheduled outcome
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          git fetch origin production-monitor:refs/remotes/origin/production-monitor
          git show origin/production-monitor:evidence/production-track-record.json > /tmp/current-production-track-record.json
          npx tsx scripts/update-production-track-record.ts /tmp/current-production-track-record.json /tmp/next-production-track-record.json
          git config user.name "positioncrew-monitor[bot]"
          git config user.email "positioncrew-monitor[bot]@users.noreply.github.com"
          git checkout -B production-monitor origin/production-monitor
          cp /tmp/next-production-track-record.json evidence/production-track-record.json
          git add evidence/production-track-record.json
          if git diff --cached --quiet; then
            echo "Scheduled run ${GITHUB_RUN_ID} is already recorded."
          else
            git commit -m "Record production run ${GITHUB_RUN_ID}"
            git push origin HEAD:production-monitor
          fi
      - name: Enforce production verification
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: test "$VERIFY_OUTCOME" = "success"

  bounded-grid-shadow-session:
    if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect one protected forward-shadow session
        env:
          POSITIONCREW_BASE_URL: https://positioncrew.dolepee.com
          SHADOW_GRID_TICK_TOKEN: ${{ secrets.POSITIONCREW_SHADOW_GRID_TICK_TOKEN }}
          POSITIONCREW_SHADOW_GRID_OUTPUT: /tmp/positioncrew-bounded-grid-forward-shadow-session.json
        run: node scripts/collect-bounded-grid-shadow-ledger.mjs
      - name: Preserve session evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: positioncrew-bounded-grid-forward-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/positioncrew-bounded-grid-forward-shadow-session.json
          if-no-files-found: error
          retention-days: 30

  attest-runtime-rotation-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'attest-runtime-rotation-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Authenticate preserved run-to-archive bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/attest-runtime-rotation-evidence.mjs
      - name: Attest preserved runtime rotation archives
        uses: actions/attest@v4
        with:
          subject-path: |
            evidence/termix-runtime-rotation-artifacts/*.zip
            evidence/termix-runtime-rotation-events.manifest.json
